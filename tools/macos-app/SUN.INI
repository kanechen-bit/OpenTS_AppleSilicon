; OpenTS.app -- default settings, copied to
; ~/Library/Application Support/OpenTS/SUN.INI on first launch.
;
; The engine reads SUN.INI through its file layer, which resolves it in the user
; directory rather than beside the executable, so this template is what a fresh
; install starts from. Once the game saves its settings the game owns the file
; and this template is not consulted again.
;
; The values below are the ones this port was tuned with; see docs/ for the
; measurements behind the video ones.

[Intro]
PlayIntro=no

[Options]
GameSpeed=3
Difficulty=1
ScrollMethod=0
ScrollRate=4
AutoScroll=yes
ArrowPan=yes
DetailLevel=2
SidebarCameoText=yes
SidebarSorting=yes
UnitActionLines=yes
ToolTips=yes
TextBackgroundColor=12
AutoSaveInterval=10800

[Video]
ScreenWidth=640
ScreenHeight=480
StretchMovies=no

; A window, not a borderless full screen. The launcher also passes -W, and the
; two have to agree: the switch asks for a window, this is what it falls back to
; when the switch is absent. On macOS the full screen the game otherwise asks
; for puts the player in a separate Space they have to swipe out of to get back
; to the Finder.
Fullscreen=no
WindowWidth=-1
WindowHeight=-1

; 2x supersample, minified 2:1 at present, which is what removes the jaggies
; without softening the pixel art the way a straight bilinear scale does.
ScaleMode=SuperSample

; Unsharp 5-tap applied to that 2:1 minify. At 0 it is a plain downsample;
; 1.0 is the crisp end, past which the pixel art starts to ring.
Sharpness=1.000000

IntegerScaling=no
VSync=no
Renderer=0
CursorScale=0

[Audio]
SoundVolume=0.700000
VoiceVolume=1.000000
ScoreVolume=0.500000
IsScoreRepeat=no
IsScoreShuffle=no
SoundLatency=9

[MultiPlayer]
Color=0
Side=GDI
Handle=Kane
